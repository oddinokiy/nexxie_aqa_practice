name: Playwright Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Скачиваем код из репозитория
      uses: actions/checkout@v4

    - name: Устанавливаем Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Устанавливаем библиотеки из requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Устанавливаем браузеры Playwright
      run: python -m playwright install --with-deps

    - name: Создаем папку auth
      run: mkdir -p auth

    - name: Восстанавливаем auth/user.json из Секретов Гитхаба
      run: echo '${{ secrets.AUTH_USER_JSON }}' > auth/user.json

    - name: Запускаем наши тесты
      run: pytest

    - name: Сохраняем Allure отчеты на Гитхаб
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-test-results
        path: allure-results/
        retention-days: 7